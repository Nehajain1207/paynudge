spring.application.name=paynudge

# In-memory database for local runs (PostgreSQL via Docker comes next)
spring.datasource.url=jdbc:h2:mem:paynudge;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Model settings. The key is read from the GEMINI_API_KEY environment variable and is never stored in code.
# With no key, the app runs on a free offline mock model.
paynudge.llm.api-key=${GEMINI_API_KEY:}
paynudge.llm.base-url=https://generativelanguage.googleapis.com/v1beta/openai
paynudge.llm.model=gemini-flash-latest

# Any OpenAI-compatible provider works. Example for Groq:
#   --paynudge.llm.base-url=https://api.groq.com/openai/v1 --paynudge.llm.model=llama-3.3-70b-versatile

# Pause between eval cases, to stay inside free-tier rate limits
paynudge.eval.pace-ms=3000
