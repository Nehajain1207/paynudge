<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayNudge</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --ink:#17212b; --muted:#5f6b76; --line:#dbe2dd; --accent:#0e6b64; --soft:#e2f0ee; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px; display:grid; grid-template-columns:1fr 300px; gap:16px; }
  @media (max-width:760px) { .wrap { grid-template-columns:1fr; } }
  h1 { font-size:22px; margin:0 0 4px; } h1 span { color:var(--accent); }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  header { grid-column:1/-1; display:flex; justify-content:space-between; align-items:end; gap:12px; flex-wrap:wrap; }
  select, input, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:inherit; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .assistant { align-self:flex-start; background:var(--soft); }
  .tool { align-self:flex-start; font:12px ui-monospace, Consolas, monospace; color:var(--muted); border:1px dashed var(--line); background:#fff; }
  form { display:flex; gap:8px; margin-top:10px; } form input { flex:1; min-width:0; }
  .side { display:flex; flex-direction:column; gap:16px; }
  ul { margin:0; padding-left:18px; } li { margin-bottom:4px; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Pay<span>Nudge</span></h1><div class="muted">AI payment-reminder agent. You are chatting as the customer.</div></div>
    <label>Customer <select id="customer"></select></label>
  </header>
  <div class="card">
    <div id="log"></div>
    <form id="form">
      <input id="text" placeholder="Try: How much do I owe?" autocomplete="off" required maxlength="1000">
      <button id="send">Send</button>
    </form>
  </div>
  <div class="side">
    <div class="card"><h2>Dues</h2><div id="dues" class="muted">Loading…</div></div>
    <div class="card"><h2>Recorded promises</h2><div id="promises" class="muted">None yet.</div></div>
    <div class="card"><h2>Chat summary</h2><div id="summary" class="muted">Not summarised yet.</div>
      <button id="summarise" style="margin-top:10px">Summarise chat</button></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch('/api' + path, opts).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let customerId;

function bubble(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
}
async function refreshSide() {
  const d = await api(`/customers/${customerId}/dues`);
  $('dues').innerHTML = `<strong>Total: ₹${esc(d.total_due)}</strong><ul>` +
    d.invoices.map(i => `<li>#${esc(i.invoice_id)} ${esc(i.description)}: ₹${esc(i.amount)} (${i.days_overdue > 0 ? esc(i.days_overdue) + ' days overdue' : 'due ' + esc(i.due_date)})</li>`).join('') + '</ul>';
  const p = await api(`/customers/${customerId}/promises`);
  $('promises').innerHTML = p.length ? '<ul>' + p.map(x => `<li>₹${esc(x.amount)} by ${esc(x.promisedDate)} (invoice #${esc(x.invoiceId)})</li>`).join('') + '</ul>' : 'None yet.';
}
async function loadCustomer() {
  customerId = $('customer').value; $('log').innerHTML = '';
  const history = await api(`/customers/${customerId}/messages`);
  history.forEach(m => bubble(m.role, m.content));
  api(`/customers/${customerId}/summaries`).then(list => showSummary(list[0]));
  refreshSide();
}
function showSummary(x) {
  $('summary').innerHTML = x ? `<ul><li><strong>Intent:</strong> ${esc(x.intent)}</li><li><strong>Sentiment:</strong> ${esc(x.sentiment)}</li>` +
    (x.promisedDate ? `<li><strong>Promised:</strong> ₹${esc(x.promisedAmount)} by ${esc(x.promisedDate)}</li>` : '') +
    `<li><strong>Next action:</strong> ${esc(x.nextAction)}</li></ul>` : 'Not summarised yet.';
}
$('summarise').addEventListener('click', async () => {
  $('summarise').disabled = true;
  try { showSummary(await api(`/customers/${customerId}/summary`, { method: 'POST' })); }
  catch (err) { $('summary').textContent = 'Could not summarise (' + err.message + '). Send a message first, or check the server log.'; }
  $('summarise').disabled = false;
});
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('text').value.trim(); if (!text) return;
  $('text').value = ''; $('send').disabled = true; bubble('user', text);
  try {
    const res = await api(`/customers/${customerId}/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text }) });
    res.toolsUsed.forEach(t => bubble('tool', `tool: ${t.name}(${JSON.stringify(t.arguments)})\n→ ${JSON.stringify(t.result)}`));
    bubble('assistant', res.reply);
    refreshSide();
  } catch (err) { bubble('tool', 'Something went wrong (' + err.message + '). Check the server log.'); }
  $('send').disabled = false; $('text').focus();
});
(async () => {
  const list = await api('/customers');
  $('customer').innerHTML = list.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('customer').addEventListener('change', loadCustomer);
  loadCustomer();
})();
</script>
</body>
</html>
