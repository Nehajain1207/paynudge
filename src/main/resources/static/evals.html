<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayNudge evals</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --ink:#17212b; --muted:#5f6b76; --line:#dbe2dd; --accent:#0e6b64; --good:#2d7a4c; --bad:#a23b32; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } h1 span { color:var(--accent); }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:16px 0; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .tile b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:13px; min-width:640px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .pass { color:var(--good); font-weight:600; } .fail { color:var(--bad); font-weight:600; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pay<span>Nudge</span> evals</h1>
  <div class="muted">Scripted conversations scored on what the agent did: tools called and rows written. <a href="/">Back to chat</a></div>
  <div class="bar">
    <button id="run">Run eval suite</button>
    <span id="progress" class="muted"></span>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="tablewrap"><table>
    <thead><tr><th>Case</th><th>Customer said</th><th>Result</th><th>Detail</th><th>Tools</th><th>ms</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="muted">No run yet.</td></tr></tbody>
  </table></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tile = (label, value) => `<div class="tile"><b>${esc(value)}</b><span class="muted">${esc(label)}</span></div>`;
let timer;

async function refresh() {
  const s = await fetch('/api/evals/status').then(r => r.json());
  $('run').disabled = s.running;
  $('progress').textContent = s.total ? `${s.done} of ${s.total} cases · model: ${s.model}${s.running ? ' · running…' : ''}` : `model: ${s.model}`;
  if (s.results.length) $('rows').innerHTML = s.results.map(r => `<tr>
      <td>${esc(r.id)}</td><td>${esc(r.input)}</td>
      <td class="${r.passed ? 'pass' : 'fail'}">${r.error ? 'error' : r.passed ? 'pass' : 'FAIL'}</td>
      <td>${esc(r.detail)}</td><td>${esc(r.tools.join(', '))}</td><td>${esc(r.latencyMs.join(', '))}</td></tr>`).join('');
  const m = s.summary;
  $('tiles').innerHTML = m ? [
    tile('cases passed', `${m.passed} / ${m.cases - m.errors}`),
    tile('overall pass rate', m.passRatePct + '%'),
    tile(`promise extraction (${m.promiseCases} cases)`, m.promiseExtractionPct + '%'),
    tile(`invented promises (${m.noPromiseCases} cases)`, m.inventedPromises),
    tile(`dues + link correct (${m.duesAndLinkCases} cases)`, m.duesAndLinkPct + '%'),
    tile('reply time p50 / p95', `${m.latencyP50Ms} / ${m.latencyP95Ms} ms`),
    tile('API errors (not scored)', m.errors)
  ].join('') : '';
  if (!s.running) clearInterval(timer);
}
$('run').addEventListener('click', async () => {
  await fetch('/api/evals/run', { method: 'POST' });
  clearInterval(timer); timer = setInterval(refresh, 2000); refresh();
});
refresh(); timer = setInterval(refresh, 2000);
</script>
</body>
</html>
